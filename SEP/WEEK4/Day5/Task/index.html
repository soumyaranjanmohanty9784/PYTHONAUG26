<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>


    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center p-6">

    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-2xl p-8">

        <!-- Header -->
        <div class="text-center mb-8">


            <div class="w-20 h-20 mx-auto bg-indigo-500 rounded-full 
                        flex items-center justify-center text-5xl shadow-lg">
                🎓
            </div>

            <h1 class="text-3xl font-bold text-gray-800 mt-4">
                Student Registration
            </h1>

            <p class="text-gray-500 mt-2">
                Register your details below
            </p>

        </div>


        <form id="studentForm" class="grid grid-cols-1 md:grid-cols-2 gap-5">

            <div>
                <label class="block font-semibold text-gray-700 mb-2">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg 
                           focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
            </div>


            <div>
                <label class="block font-semibold text-gray-700 mb-2">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg 
                           focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
            </div>

            <div>
                <label class="block font-semibold text-gray-700 mb-2">
                    Phone
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg 
                           focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
            </div>

            <div>
                <label class="block font-semibold text-gray-700 mb-2">
                    Date of Birth
                </label>

                <input
                    type="date"
                    id="dob"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg 
                           focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
            </div>


            <div>
                <label class="block font-semibold text-gray-700 mb-2">
                    Gender
                </label>

                <select
                    id="gender"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg 
                           focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="md:col-span-2">
                <label class="block font-semibold text-gray-700 mb-2">
                    Address
                </label>

                <textarea
                    id="address"
                    rows="4"
                    placeholder="Enter your address"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg 
                           focus:outline-none focus:ring-2 focus:ring-indigo-500"
                ></textarea>
            </div>


            <div class="md:col-span-2 flex flex-col sm:flex-row gap-4 mt-3">

                <button
                    type="submit"
                    class="flex-1 bg-indigo-600 hover:bg-indigo-700 
                           text-white font-bold py-3 rounded-lg 
                           transition duration-300"
                >
                    Register
                </button>

                <button
                    type="button"
                    onclick="viewDetails()"
                    class="flex-1 bg-gray-800 hover:bg-gray-900 
                           text-white font-bold py-3 rounded-lg 
                           transition duration-300"
                >
                    View Details
                </button>

            </div>

        </form>


        <div
            id="details"
            class="hidden mt-8 bg-indigo-50 border border-indigo-100 
                   rounded-xl p-6"
        >

            <h2 class="text-2xl font-bold text-gray-800 mb-5">
                📋 Student Details
            </h2>

            <div class="space-y-3">

                <p>
                    <strong>Name:</strong>
                    <span id="displayName"></span>
                </p>

                <p>
                    <strong>Email:</strong>
                    <span id="displayEmail"></span>
                </p>

                <p>
                    <strong>Phone:</strong>
                    <span id="displayPhone"></span>
                </p>

                <p>
                    <strong>Date of Birth:</strong>
                    <span id="displayDob"></span>
                </p>

                <p>
                    <strong>Gender:</strong>
                    <span id="displayGender"></span>
                </p>

                <p>
                    <strong>Address:</strong>
                    <span id="displayAddress"></span>
                </p>

            </div>

        </div>

    </div>
    <script src="script.js"></script>

</body>
</html>
