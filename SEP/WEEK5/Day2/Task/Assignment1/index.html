<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center p-5">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8">

        <div class="text-center mb-7">

            <h1 class="text-3xl font-bold text-gray-800">
                Registration
            </h1>

            <p class="text-gray-500 mt-2">
                Create your account
            </p>
        </div>

        <form id="registrationForm" class="space-y-4">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500"
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500"
            >

            <input
                type="tel"
                id="phone"
                placeholder="Phone Number"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500"
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500"
            >

            <button
                type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition"
            >
                Register
            </button>

        </form>

        <p id="message" class="text-center mt-5 font-semibold"></p>

    </div>

<script src="script.js"></script>
    

</body>
</html>
