<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center p-5">

    <div class="w-full max-w-xl bg-white rounded-3xl shadow-2xl p-8">

        <div class="text-center mb-8">

            <div class="w-20 h-20 mx-auto bg-indigo-100 rounded-full flex items-center justify-center text-5xl">
                🎓
            </div>

            <h1 class="text-3xl font-bold text-gray-800 mt-4">
                Student Registration
            </h1>

            <p class="text-gray-500 mt-2">
                Create your student profile
            </p>

        </div>

        <form id="studentForm" class="space-y-5">

            <div>
                <label class="block text-gray-700 font-semibold mb-2">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                >
            </div>


            <div>
                <label class="block text-gray-700 font-semibold mb-2">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                >
            </div>

            <div>
                <label class="block text-gray-700 font-semibold mb-2">
                    Phone
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                >
            </div>


            <div>
                <label class="block text-gray-700 font-semibold mb-2">
                    Date of Birth
                </label>

                <input
                    type="date"
                    id="dob"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                >
            </div>


            <div>

                <label class="block text-gray-700 font-semibold mb-2">
                    Gender
                </label>

                <div class="flex gap-6 flex-wrap">

                    <label class="flex items-center gap-2 cursor-pointer">
                        <input
                            type="radio"
                            name="gender"
                            value="Male"
                            required
                            class="accent-indigo-600"
                        >
                        Male
                    </label>

                    <label class="flex items-center gap-2 cursor-pointer">
                        <input
                            type="radio"
                            name="gender"
                            value="Female"
                            class="accent-indigo-600"
                        >
                        Female
                    </label>

                    <label class="flex items-center gap-2 cursor-pointer">
                        <input
                            type="radio"
                            name="gender"
                            value="Other"
                            class="accent-indigo-600"
                        >
                        Other
                    </label>

                </div>
            </div>


            <div>
                <label class="block text-gray-700 font-semibold mb-2">
                    Address
                </label>

                <textarea
                    id="address"
                    rows="4"
                    placeholder="Enter your address"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none resize-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                ></textarea>
            </div>

            <button
                type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition duration-300 hover:-translate-y-1 shadow-lg"
            >
                Register Student
            </button>

        </form>


        <button
            onclick="viewDetails()"
            class="w-full mt-4 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-xl transition duration-300"
        >
            👁️ View Details
        </button>

        <div
            id="studentDetails"
            class="hidden mt-6 p-5 bg-indigo-50 rounded-xl border-l-4 border-indigo-600"
        >
        </div>

    </div>
<script src="script.js"></script>
</body>
</html>
