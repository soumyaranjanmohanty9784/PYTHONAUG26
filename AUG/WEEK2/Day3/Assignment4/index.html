<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Cards Design</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">

        <div class="info-card">
            <h3>Assess</h3>
            <p>Test your design skills and establish benchmarks.</p>
        </div>


        <div class="info-card">
            <h3>Learn</h3>
            <p>Access a design library of course.</p>
        </div>

        
        <div class="info-card">
            <h3>Showcase</h3>
            <p>Every skill you learn is automatically recorded on profile. Show it off and see how you stack up to other designers.</p>
        </div>
    </div>

</body>
</html>
