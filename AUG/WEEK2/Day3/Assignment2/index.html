<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-comparison">
  <div class="form-section">
    <h3>DO:</h3>

    <div class="form-box">
      <label for="do-name">Name</label>
      <input id="do-name" type="text" placeholder="Name">

      <label for="do-email">Email</label>
      <input id="do-email" type="email" placeholder="Email">

      <label for="do-company">Company</label>
      <input id="do-company" type="text" placeholder="Company">
    </div>
  </div>

  <div class="form-section">
    <h3>DON’T:</h3>

    <div class="form-box">
      <label for="dont-name">Name</label>
      <input id="dont-name" type="text" placeholder="Name">

      <label for="dont-email">Email</label>
      <input id="dont-email" type="email" placeholder="Email">

      <label for="dont-company">Company</label>
      <input id="dont-company" type="text" placeholder="Company">
    </div>
  </div>
</div>

</body>
</html>
