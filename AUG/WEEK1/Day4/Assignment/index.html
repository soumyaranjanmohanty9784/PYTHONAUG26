        <legend><b>Expansions</b></legend>

    <p>1) a<sup>3</sup> - b<sup>3</sup> = (a + b)(a - b)</p>

    <p>2) (a + b)<sup>2</sup> = a<sup>2</sup> + 2ab + b<sup>2</sup></p>
