<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina Login</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="login-box">

    <div class="left">

      <div class="logo">Lumina</div>

      <h1>Welcome back!</h1>

      <p class="subtitle">
        Pick up where you left off, and keep things moving.
      </p>

      <input type="email"
             class="input-box"
             placeholder="john.doe@gmail.com">

      <input type="password"
             class="input-box"
             placeholder="••••••••">

      <div class="options">

        <label class="remember">
          <input type="checkbox">
          Remember me
        </label>

        <span class="forgot">
          Forgot password?
        </span>

      </div>

      <button class="login-btn">
        Log in
      </button>

      <div class="or">or</div>

      <button class="google-btn">
        <span>G</span>
        Continue with Google
      </button>

      <div class="signup">
        Don't have an account?
        <a href="#">Sign up</a>
      </div>

    </div>


    <div class="right">

      <div class="cloud"></div>

      <div class="mountain"></div>
      <div class="mountain2"></div>

      <div class="ground"></div>

      <div class="sun"></div>

      <div class="tree">
        <div class="leaves"></div>
        <div class="trunk"></div>
      </div>

      <div class="path"></div>

      <div class="character">
        <div class="eye left-eye"></div>
        <div class="eye right-eye"></div>
        <div class="mouth"></div>
      </div>

    </div>

  </div>

</body>
</html>
